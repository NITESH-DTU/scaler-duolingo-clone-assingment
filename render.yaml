services:
  - type: web
    name: duolingo-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python seed.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duolingo-db
          property: connectionString

databases:
  - name: duolingo-db
    databaseName: duolingo
    user: duolingo
    plan: basic-256mb
    region: singapore
